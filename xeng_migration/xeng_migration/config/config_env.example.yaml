# Copy to config/env.yaml (or env_Prod.yaml) and fill in.
# NEVER commit the filled-in copy.
connection:
  protocol: "https"
  hostname: "<host>"
  port: "443"
  base_path: "/otcs/cs.exe"
  username: "<user>"
  password: ""            # leave blank to be prompted at runtime
  verify_ssl: true
engineering_api:
  base_url: "https://<host>/otcs/cs.exe/api"

master:
  parent_id: 0
  template_id: 0
  type_id: 2
  category_id: 0
  attributes:
    project_number: "<catId>_<attrId>"

project:
  parent_id: 0
  template_id: 0
  type_id: 1
  category_id: 0
  attributes:
    project_number: "<catId>_<attrId>"
  classification_ids: []

document:
  category_id: 0
  disable_inheritance_categories: []
  attributes: {}

source:
  root: "\\\\<server>\\<share>"
  project_folder_is_number: true

revisions:
  enabled: true
  control_action: "changerevisionstatus"
  stage_status_map: {}

input:
  projects_xlsx: "input/List of Running Projects.xlsx"
  register_xlsx: "input/Document_Register.xlsx"
  projects_header_row: 1
  register_header_row: 2

runtime:
  tracker_db: "migration.db"
  workers: 8
  progress_every: 100

closed_projects:
  enabled: true
  strategy: "create"
  status_column: "Project Status"
  closed_values: ["Closed"]
  classification_ids: []
